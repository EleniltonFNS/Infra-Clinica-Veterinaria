# Configuração do servidor web Nginx na DMZ para o portal de agendamento.
# Escuta nas portas 80 (HTTP) e 443 (HTTPS com certificado de laboratório).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Certificados autoassinados gerados durante a construção da imagem
    ssl_certificate /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Diretório raiz com os arquivos públicos do portal
    root /usr/share/nginx/html;
    index index.html;

    # Rota de verificação de integridade (healthcheck do container)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Tratamento padrão de requisições
    location / {
        try_files $uri $uri/ =404;
    }
}
