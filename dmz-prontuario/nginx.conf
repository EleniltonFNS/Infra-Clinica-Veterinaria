# Configuração do serviço de Prontuário Eletrônico da Clínica Pata Amiga.
# Escuta exclusivamente na porta 8443 com HTTPS utilizando certificado SSL de laboratório.
server {
    listen 8443 ssl default_server;
    server_name _;

    # Certificados autoassinados compartilhados com a imagem do servidor web
    ssl_certificate /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Rota de integridade para monitoramento do serviço
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Endpoint simulado da API de prontuários clínicos (dados fictícios)
    location = /api/prontuarios/1 {
        default_type application/json;
        return 200 '{"sistema":"prontuario","paciente":"Thor","especie":"cao","diagnostico":"Otite externa","observacao":"dados ficticios de laboratorio"}\n';
    }
}
