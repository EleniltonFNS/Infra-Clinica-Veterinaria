name: clinica-pata-amiga

services:
  firewall:
    build: ./firewall
    init: true
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"

    environment: # Disponibiliza no container as variáveis definidas no arquivo .env
      LAN_SUBNET: ${LAN_SUBNET}
      DMZ_SUBNET: ${DMZ_SUBNET}
      EXTERNAL_SUBNET: ${EXTERNAL_SUBNET}
      FIREWALL_LAN_IP: ${FIREWALL_LAN_IP}
      FIREWALL_DMZ_IP: ${FIREWALL_DMZ_IP}
      FIREWALL_EXTERNAL_IP: ${FIREWALL_EXTERNAL_IP}
      MEDICO_IP: ${MEDICO_IP}
      TUTOR_IP: ${TUTOR_IP}
      WEB_IP: ${WEB_IP}
      PRONTUARIO_IP: ${PRONTUARIO_IP}
      DB_IP: ${DB_IP}

    volumes:
      - ./firewall/rules.sh:/usr/local/sbin/rules.sh:ro # Permite editar regras no host sem precisar reconstruir a imagem

    command: ["tail", "-f", "/dev/null"] # Mantém o container em execução após o entrypoint.sh carregar as regras de firewall
    networks:
      lan:
        ipv4_address: ${FIREWALL_LAN_IP}
      dmz:
        ipv4_address: ${FIREWALL_DMZ_IP}
      external:
        ipv4_address: ${FIREWALL_EXTERNAL_IP}

  dmz-web:
    build: ./dmz-web
    init: true
    cap_add:
      - NET_ADMIN # Permite gerenciar rotas de rede para apontar o gateway
    environment:
      FIREWALL_DMZ_IP: ${FIREWALL_DMZ_IP}
    networks:
      dmz:
        ipv4_address: ${WEB_IP}

  dmz-prontuario:
    build: ./dmz-web # Reutiliza a imagem base do Nginx da DMZ
    init: true
    cap_add:
      - NET_ADMIN # Permite gerenciar rotas de rede para apontar o gateway
    environment:
      FIREWALL_DMZ_IP: ${FIREWALL_DMZ_IP}
    volumes:
      - ./dmz-prontuario/nginx.conf:/etc/nginx/conf.d/default.conf:ro # Sobrescreve a configuração do site pela da API
    networks:
      dmz:
        ipv4_address: ${PRONTUARIO_IP}

  dmz-db:
    image: postgres:16-alpine
    init: true
    cap_add:
      - NET_ADMIN # Permite gerenciar rotas de rede para apontar o gateway
    entrypoint: # Configura rota default para o firewall e inicia o processo do PostgreSQL
      - /bin/sh
      - -c
      - ip route replace default via "$$FIREWALL_DMZ_IP" && exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      FIREWALL_DMZ_IP: ${FIREWALL_DMZ_IP}
    volumes:
      - dbdata:/var/lib/postgresql/data # Volume nomeado para persistência dos dados
      - ./dmz-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro # Script de inicialização das tabelas
    networks:
      dmz:
        ipv4_address: ${DB_IP}

  medico:
    build: ./cliente
    init: true
    cap_add:
      - NET_ADMIN # Permite gerenciar a tabela de rotas do container
    environment:
      PERFIL: medico
      FIREWALL_LAN_IP: ${FIREWALL_LAN_IP}
      TUTOR_IP: ${TUTOR_IP}
      WEB_IP: ${WEB_IP}
      PRONTUARIO_IP: ${PRONTUARIO_IP}
      DB_IP: ${DB_IP}
    extra_hosts:
      dmz-web: ${WEB_IP}
      dmz-prontuario: ${PRONTUARIO_IP}
      dmz-db: ${DB_IP}
    networks:
      lan:
        ipv4_address: ${MEDICO_IP}

  tutor:
    build: ./cliente
    init: true
    cap_add:
      - NET_ADMIN # Permite gerenciar a tabela de rotas do container
    environment:
      PERFIL: tutor
      FIREWALL_EXTERNAL_IP: ${FIREWALL_EXTERNAL_IP}
      MEDICO_IP: ${MEDICO_IP}
      WEB_IP: ${WEB_IP}
      PRONTUARIO_IP: ${PRONTUARIO_IP}
      DB_IP: ${DB_IP}
    extra_hosts:
      dmz-web: ${WEB_IP}
      dmz-prontuario: ${PRONTUARIO_IP}
      dmz-db: ${DB_IP}
    networks:
      external:
        ipv4_address: ${TUTOR_IP}

networks:
  lan:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${LAN_SUBNET}

  dmz:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${DMZ_SUBNET}

  external:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${EXTERNAL_SUBNET}

volumes:
  dbdata: # Volume persistente do banco de dados PostgreSQL